# Builds a dsh-mobile test APK: the patched runtime bundle plus the Flutter app,
# signed with the persistent prerelease key, under the `.test` applicationId so it installs
# alongside the official app.
#
# Manual only: this needs the full runtime (rtbuild applies 139 engine patches,
# installs Node/pnpm/DSH, and packs the rootfs), which is far too heavy for the
# PR CI path filter. Expect roughly 40-60 minutes.
name: Test APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'ABI flavor'
        type: choice
        options: [arm64, x64, all]
        default: arm64
      mode:
        description: 'Build mode (release embeds the runtime bundle)'
        type: choice
        options: [release, debug]
        default: release

permissions:
  contents: read

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  TZ: Asia/Shanghai

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # rtbuild is idempotent and verifies every download against a pinned hash;
      # the cache just saves the re-download, not correctness.
      - name: Cache runtime downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            runtime/.cache
            runtime/.work
          key: runtime-full-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**', 'runtime/patches/**', 'runtime/lib/rtbuild.py') }}

      # libtawcroot's build.py requires this exact NDK (runtime/tawcroot/source.json);
      # the runner image ships a different one, and release builds must carry it.
      - name: Install the pinned NDK
        run: |
          ndk=$(python3 -c "import json;print(json.load(open('runtime/tawcroot/source.json'))['ndkVersion'])")
          echo "NDK $ndk"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"

      - name: Build the runtime bundle
        run: |
          # arm64-v8a and x86_64; the app flavors read runtime/out/<abi>.
          bash runtime/build-runtime.sh

      - name: Restore persistent prerelease signing
        env:
          KEYSTORE_BASE64: ${{ secrets.PRERELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PRERELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PRERELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PRERELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os, base64, pathlib
          required = ['KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_PASSWORD', 'KEY_ALIAS']
          if any(not os.environ.get(k) for k in required):
              raise SystemExit('Persistent prerelease signing secrets are missing')
          key = pathlib.Path(os.environ['RUNNER_TEMP']) / 'prerelease-signing.p12'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          props = {'storeFile': str(key), 'storePassword': os.environ['STORE_PASSWORD'],
                   'keyPassword': os.environ['KEY_PASSWORD'], 'keyAlias': os.environ['KEY_ALIAS']}
          def esc(value):
              return value.replace('\\', '\\\\').replace(':', '\\:').replace('=', '\\=')
          pathlib.Path('app/android/key.properties').write_text(''.join(f'{k}={esc(v)}\n' for k, v in props.items()))
          PY

      - name: Build the APK
        env:
          FLAVOR: ${{ inputs.flavor }}
          MODE: ${{ inputs.mode }}
          DSH_REQUIRE_RELEASE_SIGNING: "1"
        run: |
          bash tooling/build-apk.sh --"$MODE" -f "$FLAVOR"

      - name: Verify package and persistent signing certificate
        run: |
          set -euo pipefail
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          expected=bf4b5f220e21feed52a10d531aba59577373ca055fcad7fe6a1ab90294812bbf
          for apk in app/build/app/outputs/flutter-apk/*.apk; do
            "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
            grep -q "package: name='io.github.ccch1mneyyy.dsh_app.test'" "$RUNNER_TEMP/badging.txt"
            "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signature.txt"
            grep -qi "certificate SHA-256 digest: $expected" "$RUNNER_TEMP/signature.txt"
            cat "$RUNNER_TEMP/signature.txt"
          done

      - name: Remove signing files
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP/prerelease-signing.p12"

      - name: Collect the APKs
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          find app/build/app/outputs/flutter-apk -name '*.apk' -exec cp {} "$RUNNER_TEMP/out/" \;
          ls -lh "$RUNNER_TEMP/out"
          for apk in "$RUNNER_TEMP/out"/*.apk; do
            sha256sum "$apk" >> "$RUNNER_TEMP/out/SHA256SUMS"
          done

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-go-test-apk-${{ inputs.flavor }}-${{ inputs.mode }}
          path: ${{ runner.temp }}/out/
          retention-days: 14
